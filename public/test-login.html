<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>言霊掲示板 - ログインテスト</title>
    <!-- Google Identity Services のライブラリ読み込み -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f9f9f9;
        }
        #user-info {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>言霊掲示板へようこそ</h1>
    <p>下のボタンからGoogleアカウントでログインしてください</p>

    <!-- Googleログインボタンを表示するエリア -->
    <div id="g_id_onload"
         data-client_id="564187839163-lafaj28q9mk17gmht90lvnc6agdbrfhe.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="sign_in_with"
         data-shape="rectangular"
         data-logo_alignment="left">
    </div>

    <div id="user-info"></div>

    <script>
        // ログイン成功時に呼ばれる関数
        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID token: " + response.credential);
            
            // トークンをデコードしてユーザーの情報を取得する処理
            const responsePayload = parseJwt(response.credential);
            
            console.log("ID: " + responsePayload.sub);
            console.log("名前: " + responsePayload.name);
            console.log("メールアドレス: " + responsePayload.email);
            
            // 画面にログイン成功メッセージと名前を表示
            document.getElementById('user-info').innerHTML = 
                `<b style="color: green;">✔ ログイン成功！</b><br>` +
                `ようこそ、${responsePayload.name} さん (${responsePayload.email}) ログインできました！`;
        }

        // JWT（暗号化されたユーザー情報）を読みやすい形に分解する便利関数
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                // @ts-ignore
                return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>

</body>
</html>
